<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wandernter-händler.shop</title>
    <style>
        body {
            margin: 0;
        }

        .background {
            height: 100vh;
            width: 100%;
            object-fit: cover;
        }

        .top-leiste {
            position: absolute;
            right: 32px;
            left: 32px;
            top: 8px;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-links {
            color: black;
            text-decoration: none;
            margin-left: 10px;
        }

        .menu-links:hover {
            text-decoration: underline;
        }

        .button {
            background-color: darkgreen;
            padding: 8px;
            border-radius: 8px;
            
        }
        .logo {
            position: relative;
            left: 32px;
            top: 8px;
            font-size: 8px;
        }

        .slogan{
            position: absolute;
            color: lightgray;
            left: 128px;
            top: 384px;
            font-size: 64px;
            text-shadow: 10px 10px 2px rgba(0, 0, 0, 0.5);
        }
        .slogan-color {
            color: lightgreen;
        }
    </style>
</head>

<body>
    <img src="../pictures/picture2.png" class="background">
    <div class="top-leiste">
        <img src="../pictures/logo.png" class="logo">

        <div>
            <a href="" class="menu-links">Spezielle-Items</a>
            <a href="" class="menu-links">Log-In</a>
            <a href="" class="menu-links button">Shop</a>
        </div>
    </div>
    <h1 class="slogan">Bestelle deine <span class="slogan-color">Items</span> jetzt <span class="slogan-color">online</span>!</h1>
</body>

</html>
